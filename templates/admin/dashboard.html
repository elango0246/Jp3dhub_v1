<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blaster3D Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Admin Themes -->
   
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #050508;
            color: #e8e8f0;
        }
        
        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100%;
            background: #0d0d14;
            border-right: 1px solid rgba(255,255,255,0.06);
            padding: 30px 20px;
            overflow-y: auto;
            z-index: 100;
        }
        
        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            color: #fff;
            text-decoration: none;
            display: block;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .logo span { color: #ff4d00; }
        
        .nav-item {
            padding: 12px 20px;
            margin: 5px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .nav-item:hover {
            background: rgba(255,77,0,0.1);
        }
        
        .nav-item.active {
            background: #ff4d00;
            color: #fff;
        }
        
        /* Main Content */
        .main-content {
            margin-left: 280px;
            padding: 30px;
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        
        .page-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
        }
        
        .logout-btn {
            background: rgba(255,77,0,0.2);
            color: #ff4d00;
            padding: 8px 20px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .logout-btn:hover {
            background: #ff4d00;
            color: #fff;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #13131e;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        
        .stat-card h3 {
            color: #6b6b80;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        
        .stat-number {
            font-size: 2.5rem;
            color: #ff4d00;
            font-weight: bold;
        }
        
        /* Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .content-card {
            background: #13131e;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .content-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .card-media {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #1a1a2e;
        }
        
        .card-content {
            padding: 20px;
        }
        
        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }
        
        .card-description {
            color: #6b6b80;
            font-size: 0.85rem;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        
        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.75rem;
            color: #6b6b80;
        }
        
        .card-category {
            background: rgba(255,77,0,0.2);
            color: #ff4d00;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        
        .card-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-edit, .btn-delete {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        
        .btn-edit {
            background: #00d4ff;
            color: #fff;
        }
        
        .btn-edit:hover {
            background: #00b8e6;
            transform: translateY(-2px);
        }
        
        .btn-delete {
            background: rgba(255,0,0,0.2);
            color: #ff6666;
        }
        
        .btn-delete:hover {
            background: rgba(255,0,0,0.4);
            transform: translateY(-2px);
        }
        
        /* Add Button */
        .add-button {
            background: #ff4d00;
            color: #fff;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .add-button:hover {
            background: #ff8c42;
            transform: translateY(-2px);
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: #0d0d14;
            border: 1px solid rgba(255,77,0,0.3);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .modal-header h2 {
            color: #fff;
        }
        
        .close-modal {
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .close-modal:hover {
            color: #ff4d00;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #6b6b80;
            margin-bottom: 8px;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 600;
        }
        
        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #13131e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
        }
        
        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: #ff4d00;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .btn-submit {
            background: #ff4d00;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn-submit:hover {
            background: #ff8c42;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #13131e;
            border-left: 4px solid #ff4d00;
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 2000;
            transform: translateX(400px);
            transition: transform 0.3s;
            color: #fff;
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast.error {
            border-left-color: #ff0000;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #6b6b80;
            background: #13131e;
            border-radius: 15px;
            margin-top: 20px;
        }
        
        /* Contact List */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .contact-item {
            background: #13131e;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 20px;
        }
        
        .contact-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .contact-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }
        
        .contact-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            background: rgba(255,77,0,0.2);
            color: #ff4d00;
        }
        
        .contact-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .contact-detail {
            font-size: 0.85rem;
            color: #6b6b80;
        }
        
        .contact-detail strong {
            color: #fff;
        }
        
        .contact-message {
            background: #1a1a2e;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #e8e8f0;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }
            .sidebar .nav-item span:not(.icon) {
                display: none;
            }
            .main-content {
                margin-left: 80px;
            }
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="#" class="logo">BLAST<span>3D</span></a>
        <div class="nav-item active" onclick="loadSection('dashboard')">
            <span class="icon">📊</span>
            <span>Dashboard</span>
        </div>
        <div class="nav-item" onclick="loadSection('gallery')">
            <span class="icon">🖼️</span>
            <span>Gallery</span>
        </div>
        <div class="nav-item" onclick="loadSection('testimonials')">
            <span class="icon">💬</span>
            <span>Testimonials</span>
        </div>
        <div class="nav-item" onclick="loadSection('contacts')">
            <span class="icon">📧</span>
            <span>Contacts</span>
        </div>
    </div>
    
    <div class="main-content">
        <div class="header">
            <h1 class="page-title" id="pageTitle">Dashboard</h1>
            <div class="logout-btn" onclick="logout()">Logout</div>
        </div>
        
        <div id="contentArea">
            <!-- Dynamic content loads here -->
        </div>
    </div>
    
    <!-- Modal for Add/Edit -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Content</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <form id="contentForm" enctype="multipart/form-data">
                <input type="hidden" id="contentId" name="contentId">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="title" name="title" required placeholder="Enter title...">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" name="description" placeholder="Enter description..."></textarea>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category" name="category" required>
                        <option value="gallery">Gallery</option>
                        <option value="testimonial">Testimonial</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select id="type" name="type" required>
                        <option value="image">Image</option>
                        <option value="video">Video</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>File (Image/Video)</label>
                    <input type="file" id="file" name="file" accept="image/*,video/*">
                </div>
                <div class="form-group">
                    <label>Order (lower numbers show first)</label>
                    <input type="number" id="order" name="order" value="0">
                </div>
                <button type="submit" class="btn-submit">Save Content</button>
            </form>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>
    
    <script>
        const API_BASE = '';
        let token = localStorage.getItem('adminToken');
        
        // Check authentication
        if (!token) {
            window.location.href = '/admin/login';
        }
        
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = isError ? 'toast error show' : 'toast show';
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        async function apiCall(url, options = {}) {
            const defaultOptions = {
                headers: {
                    'Authorization': `Bearer ${token}`,
                }
            };
            
            if (options.body && !(options.body instanceof FormData)) {
                defaultOptions.headers['Content-Type'] = 'application/json';
                defaultOptions.body = JSON.stringify(options.body);
            } else if (options.body instanceof FormData) {
                defaultOptions.body = options.body;
            }
            
            const response = await fetch(`${API_BASE}${url}`, {
                ...defaultOptions,
                method: options.method || 'GET'
            });
            
            if (response.status === 401) {
                localStorage.removeItem('adminToken');
                localStorage.removeItem('adminInfo');
                window.location.href = '/admin/login';
                return null;
            }
            
            return response.json();
        }
        
        async function loadSection(section) {
            // Update active nav
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.nav-item').classList.add('active');
            
            document.getElementById('pageTitle').textContent = section.charAt(0).toUpperCase() + section.slice(1);
            
            if (section === 'dashboard') {
                await loadDashboard();
            } else if (section === 'gallery') {
                await loadGalleryManagement();
            } else if (section === 'testimonials') {
                await loadTestimonialsManagement();
            } else if (section === 'contacts') {
                await loadContacts();
            }
        }
        
        async function loadDashboard() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = '<div class="loading">Loading dashboard...</div>';
            
            try {
                const contents = await apiCall('/api/content/');
                const contacts = await apiCall('/api/contact/');
                
                const galleryCount = contents.contents?.filter(c => c.category === 'gallery').length || 0;
                const testimonialCount = contents.contents?.filter(c => c.category === 'testimonial').length || 0;
                
                contentArea.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <h3>Total Content Items</h3>
                            <div class="stat-number">${contents.contents?.length || 0}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Gallery Items</h3>
                            <div class="stat-number">${galleryCount}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Testimonials</h3>
                            <div class="stat-number">${testimonialCount}</div>
                        </div>
                        <div class="stat-card">
                            <h3>Contact Submissions</h3>
                            <div class="stat-number">${contacts.contacts?.length || 0}</div>
                        </div>
                    </div>
                    <button class="add-button" onclick="openAddModal()">+ Add New Content</button>
                `;
            } catch (error) {
                contentArea.innerHTML = '<div class="empty-state">Error loading dashboard</div>';
            }
        }
        
        async function loadGalleryManagement() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <button class="add-button" onclick="openAddModal()">+ Add New Gallery Item</button>
                <div id="galleryGrid" class="content-grid">
                    <div class="empty-state">Loading gallery items...</div>
                </div>
            `;
            
            try {
                const data = await apiCall('/api/content/?category=gallery');
                const grid = document.getElementById('galleryGrid');
                
                if (data.contents && data.contents.length > 0) {
                    grid.innerHTML = data.contents.map(content => `
                        <div class="content-card">
                            ${content.file_url ? `
                                ${content.type === 'video' ? 
                                    `<video class="card-media" controls>
                                        <source src="${content.file_url}" type="video/mp4">
                                    </video>` :
                                    `<img class="card-media" src="${content.file_url}" alt="${content.title}">`
                                }
                            ` : '<div class="card-media" style="display: flex; align-items: center; justify-content: center;">No Media</div>'}
                            <div class="card-content">
                                <div class="card-meta">
                                    <span class="card-category">${content.type || 'image'}</span>
                                    <span>Order: ${content.order || 0}</span>
                                </div>
                                <h3 class="card-title">${content.title || 'Untitled'}</h3>
                                <p class="card-description">${content.description || 'No description'}</p>
                                <div class="card-actions">
                                    <button class="btn-edit" onclick="editContent('${content._id}')">Edit</button>
                                    <button class="btn-delete" onclick="deleteContent('${content._id}')">Delete</button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = '<div class="empty-state">No gallery items yet. Click "Add New Gallery Item" to get started!</div>';
                }
            } catch (error) {
                console.error('Error loading gallery:', error);
                document.getElementById('galleryGrid').innerHTML = '<div class="empty-state">Error loading gallery items</div>';
            }
        }
        
        async function loadTestimonialsManagement() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <button class="add-button" onclick="openAddModal()">+ Add New Testimonial</button>
                <div id="testimonialsGrid" class="content-grid">
                    <div class="empty-state">Loading testimonials...</div>
                </div>
            `;
            
            try {
                const data = await apiCall('/api/content/?category=testimonial');
                const grid = document.getElementById('testimonialsGrid');
                
                if (data.contents && data.contents.length > 0) {
                    grid.innerHTML = data.contents.map(content => `
                        <div class="content-card">
                            <div class="card-content">
                                <div class="card-meta">
                                    <span class="card-category">Testimonial</span>
                                    <span>⭐ 5 Stars</span>
                                </div>
                                <h3 class="card-title">${content.title || 'Anonymous'}</h3>
                                <p class="card-description">"${content.description || 'No review text'}"</p>
                                <div class="card-actions">
                                    <button class="btn-edit" onclick="editContent('${content._id}')">Edit</button>
                                    <button class="btn-delete" onclick="deleteContent('${content._id}')">Delete</button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = '<div class="empty-state">No testimonials yet. Click "Add New Testimonial" to get started!</div>';
                }
            } catch (error) {
                console.error('Error loading testimonials:', error);
                document.getElementById('testimonialsGrid').innerHTML = '<div class="empty-state">Error loading testimonials</div>';
            }
        }
        
        async function loadContacts() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = '<div class="empty-state">Loading contacts...</div>';
            
            try {
                const data = await apiCall('/api/contact/');
                
                if (data.contacts && data.contacts.length > 0) {
                    contentArea.innerHTML = `
                        <div class="contact-list">
                            ${data.contacts.map(contact => `
                                <div class="contact-item">
                                    <div class="contact-header">
                                        <span class="contact-name">${contact.name}</span>
                                        <select class="contact-status" onchange="updateContactStatus('${contact._id}', this.value)">
                                            <option value="pending" ${contact.status === 'pending' ? 'selected' : ''}>📋 Pending</option>
                                            <option value="contacted" ${contact.status === 'contacted' ? 'selected' : ''}>📞 Contacted</option>
                                            <option value="quoted" ${contact.status === 'quoted' ? 'selected' : ''}>💰 Quoted</option>
                                            <option value="completed" ${contact.status === 'completed' ? 'selected' : ''}>✅ Completed</option>
                                        </select>
                                    </div>
                                    <div class="contact-details">
                                        <div class="contact-detail"><strong>Email:</strong> ${contact.email}</div>
                                        <div class="contact-detail"><strong>Phone:</strong> ${contact.phone}</div>
                                        <div class="contact-detail"><strong>Service:</strong> ${contact.service}</div>
                                        <div class="contact-detail"><strong>Date:</strong> ${new Date(contact.created_at * 1000).toLocaleDateString()}</div>
                                    </div>
                                    <div class="contact-message">
                                        <strong>Message:</strong><br>
                                        ${contact.message}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    contentArea.innerHTML = '<div class="empty-state">No contact submissions yet.</div>';
                }
            } catch (error) {
                contentArea.innerHTML = '<div class="empty-state">Error loading contacts</div>';
            }
        }
        
        async function updateContactStatus(id, status) {
            const result = await apiCall(`/api/contact/${id}/status`, {
                method: 'PUT',
                body: { status }
            });
            if (result.success) {
                showToast('Status updated successfully');
            }
        }
        
        let currentModalMode = 'add';
        
        function openAddModal() {
            currentModalMode = 'add';
            document.getElementById('modalTitle').textContent = 'Add Content';
            document.getElementById('contentForm').reset();
            document.getElementById('contentId').value = '';
            document.getElementById('modal').classList.add('active');
        }
        
        async function editContent(id) {
            currentModalMode = 'edit';
            const data = await apiCall(`/api/content/${id}`);
            if (data.content) {
                document.getElementById('contentId').value = data.content._id;
                document.getElementById('title').value = data.content.title || '';
                document.getElementById('description').value = data.content.description || '';
                document.getElementById('category').value = data.content.category || 'gallery';
                document.getElementById('type').value = data.content.type || 'image';
                document.getElementById('order').value = data.content.order || 0;
                document.getElementById('modalTitle').textContent = 'Edit Content';
                document.getElementById('modal').classList.add('active');
            }
        }
        
        async function deleteContent(id) {
            if (confirm('Are you sure you want to delete this content? This action cannot be undone.')) {
                const result = await apiCall(`/api/content/${id}`, { method: 'DELETE' });
                if (result.success) {
                    showToast('Content deleted successfully');
                    // Reload current section
                    const activeSection = document.querySelector('.nav-item.active span:last-child').textContent.toLowerCase().trim();
                    if (activeSection === 'gallery') {
                        await loadGalleryManagement();
                    } else if (activeSection === 'testimonials') {
                        await loadTestimonialsManagement();
                    } else {
                        await loadDashboard();
                    }
                } else {
                    showToast('Failed to delete content', true);
                }
            }
        }
        
        document.getElementById('contentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('type', document.getElementById('type').value);
            formData.append('order', document.getElementById('order').value);
            
            const fileInput = document.getElementById('file');
            if (fileInput.files[0]) {
                formData.append('file', fileInput.files[0]);
            }
            
            const contentId = document.getElementById('contentId').value;
            let result;
            
            if (contentId) {
                result = await apiCall(`/api/content/${contentId}`, {
                    method: 'PUT',
                    body: formData
                });
            } else {
                result = await apiCall('/api/content/', {
                    method: 'POST',
                    body: formData
                });
            }
            
            if (result.success) {
                showToast(currentModalMode === 'add' ? 'Content added successfully' : 'Content updated successfully');
                closeModal();
                // Reload current section
                const activeSection = document.querySelector('.nav-item.active span:last-child').textContent.toLowerCase().trim();
                if (activeSection === 'gallery') {
                    await loadGalleryManagement();
                } else if (activeSection === 'testimonials') {
                    await loadTestimonialsManagement();
                } else {
                    await loadDashboard();
                }
            } else {
                showToast(result.error || 'Failed to save content', true);
            }
        });
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
        
        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminInfo');
            window.location.href = '/admin/login';
        }
        
        // Load default section
        loadSection('dashboard');
    </script>
   
</body>
</html>
